<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lecture Overlay</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
      #ink { pointer-events: none; }
      body.inking { cursor: crosshair; touch-action: none; }
      #fx { pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="ink"></canvas>
    <canvas id="fx"></canvas>
    <script>
      const bridge = window.dapPresentation || {
        postMessage() {},
        onMessage() { return () => {}; },
      };

      const ink = document.getElementById("ink");
      const fx = document.getElementById("fx");
      const inkCtx = ink.getContext("2d");
      const fxCtx = fx.getContext("2d");

      let mode = "draw";
      let options = {
        color: "#ffcc00",
        strokeWidth: 4,
        spotlightSize: 170,
        spotlightDim: 0.62,
      };
      let cursor = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      let strokes = [];
      let currentStroke = null;
      const drawingModes = new Set(["draw", "line", "rect", "ellipse"]);

      function resizeCanvas(canvas, ctx) {
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        const w = Math.max(1, window.innerWidth);
        const h = Math.max(1, window.innerHeight);
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function resize() {
        resizeCanvas(ink, inkCtx);
        resizeCanvas(fx, fxCtx);
        renderInk();
      }

      function screenToLocal(point) {
        return {
          x: Number(point.x) - (window.screenX || 0),
          y: Number(point.y) - (window.screenY || 0),
        };
      }

      function renderStroke(ctx, stroke) {
        if (!stroke || stroke.points.length < 1) return;
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = stroke.width;
        ctx.beginPath();
        const first = stroke.points[0];
        const last = stroke.points[stroke.points.length - 1];
        if (stroke.kind === "line") {
          ctx.moveTo(first.x, first.y);
          ctx.lineTo(last.x, last.y);
        } else if (stroke.kind === "rect") {
          ctx.rect(first.x, first.y, last.x - first.x, last.y - first.y);
        } else if (stroke.kind === "ellipse") {
          ctx.ellipse((first.x + last.x) / 2, (first.y + last.y) / 2, Math.abs(last.x - first.x) / 2, Math.abs(last.y - first.y) / 2, 0, 0, Math.PI * 2);
        } else {
          ctx.moveTo(first.x, first.y);
          for (let i = 1; i < stroke.points.length; i++) {
            const prev = stroke.points[i - 1];
            const p = stroke.points[i];
            ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + p.x) / 2, (prev.y + p.y) / 2);
          }
        }
        ctx.stroke();
        ctx.restore();
      }

      function renderInk() {
        inkCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        for (const stroke of strokes) renderStroke(inkCtx, stroke);
        renderStroke(inkCtx, currentStroke);
      }

      function renderFx(now) {
        fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        if (mode === "spotlight") {
          const r = Number(options.spotlightSize) || 220;
          fxCtx.save();
          fxCtx.fillStyle = `rgba(0, 0, 0, ${Number(options.spotlightDim) || 0.55})`;
          fxCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);
          fxCtx.globalCompositeOperation = "destination-out";
          fxCtx.fillStyle = "rgba(0,0,0,1)";
          fxCtx.beginPath();
          fxCtx.arc(cursor.x, cursor.y, r, 0, Math.PI * 2);
          fxCtx.fill();
          fxCtx.restore();
        }

        requestAnimationFrame(renderFx);
      }

      function setMode(next) {
        mode = next;
        document.body.classList.toggle("inking", drawingModes.has(mode));
      }

      function beginStroke(e) {
        if (!drawingModes.has(mode)) return;
        e.preventDefault();
        try { ink.setPointerCapture(e.pointerId); } catch {}
        currentStroke = {
          kind: mode === "draw" ? "freehand" : mode,
          color: options.color || "#ffcc00",
          width: Number(options.strokeWidth) || 4,
          points: [{ x: e.clientX, y: e.clientY }],
        };
        renderInk();
      }

      function moveStroke(e) {
        if (!currentStroke) return;
        e.preventDefault();
        if (currentStroke.kind === "freehand") currentStroke.points.push({ x: e.clientX, y: e.clientY });
        else currentStroke.points[1] = { x: e.clientX, y: e.clientY };
        cursor = { x: e.clientX, y: e.clientY };
        renderInk();
      }

      function endStroke(e) {
        if (!currentStroke) return;
        e.preventDefault();
        if (currentStroke.points.length > 1) strokes.push(currentStroke);
        currentStroke = null;
        try { ink.releasePointerCapture(e.pointerId); } catch {}
        renderInk();
      }

      window.addEventListener("pointerdown", beginStroke, true);
      window.addEventListener("pointermove", moveStroke, true);
      window.addEventListener("pointerup", endStroke, true);
      window.addEventListener("pointercancel", endStroke, true);
      document.body.addEventListener("pointermove", (e) => {
        cursor = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        if ((e.ctrlKey || e.metaKey) && key === "z") {
          e.preventDefault();
          strokes.pop();
          renderInk();
        } else if (key === "p") {
          e.preventDefault();
          bridge.postMessage({ type: "hotkey", mode: "draw" });
        } else if (key === "s") {
          e.preventDefault();
          bridge.postMessage({ type: "hotkey", mode: "spotlight" });
        } else if (key === "l") {
          e.preventDefault();
          bridge.postMessage({ type: "hotkey", mode: "line" });
        } else if (key === "r") {
          e.preventDefault();
          bridge.postMessage({ type: "hotkey", mode: "rect" });
        } else if (key === "o") {
          e.preventDefault();
          bridge.postMessage({ type: "hotkey", mode: "ellipse" });
        } else if (key === "x") {
          e.preventDefault();
          strokes = [];
          currentStroke = null;
          renderInk();
        } else if (key === "h") {
          e.preventDefault();
          bridge.postMessage({ type: "hotkey", command: "hide" });
        }
      });

      bridge.onMessage((msg) => {
        if (!msg || typeof msg !== "object") return;
        if (msg.type === "state") {
          if (msg.mode) setMode(msg.mode);
          options = { ...options, ...(msg.options || {}) };
        } else if (msg.type === "cursor" && msg.point) {
          cursor = screenToLocal(msg.point);
        } else if (msg.type === "clear") {
          strokes = [];
          currentStroke = null;
          renderInk();
        } else if (msg.type === "undo") {
          strokes.pop();
          renderInk();
        }
      });

      window.addEventListener("resize", resize);
      resize();
      setMode(mode);
      requestAnimationFrame(renderFx);
      bridge.postMessage({ type: "ready" });
    </script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lecture Tools</title>
    <style>
      :root {
        --bg: #1e1f22;
        --panel: #2b2d31;
        --panel-hover: #34363c;
        --border: #3a3d44;
        --text: #e6e7ea;
        --muted: #9aa0a8;
        --accent: #ffcc00;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        user-select: none;
      }
      button {
        -webkit-app-region: no-drag;
        border: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #bar {
        -webkit-app-region: drag;
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.34);
      }
      .grip {
        width: 12px;
        height: 34px;
        flex: 0 0 auto;
        border-radius: 4px;
        background: radial-gradient(circle, var(--muted) 1.35px, transparent 1.55px) 0 0 / 7px 7px;
        opacity: 0.72;
      }
      #tools, .group {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .tool, .icon {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
      }
      .tool:hover, .icon:hover, .icon.open {
        background: var(--panel-hover);
        color: var(--text);
      }
      .tool.active {
        background: rgba(255, 204, 0, 0.16);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px rgba(255, 204, 0, 0.48);
      }
      .icon.primary.active {
        background: var(--accent);
        color: #1e1f22;
      }
      .requires-canvas:disabled {
        opacity: 0.36;
        cursor: default;
      }
      .requires-canvas:disabled:hover {
        background: transparent;
        color: var(--muted);
      }
      svg {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }
      .divider {
        width: 1px;
        height: 32px;
        background: var(--border);
      }
      .swatch-dot {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7);
      }
      .stroke-dot {
        width: 20px;
        height: 5px;
        border-radius: 999px;
        background: currentColor;
      }
      #clear { color: var(--danger); }
      .popover {
        -webkit-app-region: no-drag;
        position: absolute;
        top: 14px;
        display: none;
        align-items: center;
        gap: 6px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.34);
      }
      .popover.open { display: flex; }
      #colorPanel { left: 358px; }
      #sizePanel { left: 404px; }
      .swatch, .size {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
      }
      .swatch:hover, .size:hover { background: var(--panel-hover); }
      .swatch:disabled, .size:disabled {
        opacity: 0.36;
        cursor: default;
      }
      .swatch:disabled:hover, .size:disabled:hover { background: transparent; }
      .swatch span {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: var(--c);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.72);
      }
      .size span {
        width: 20px;
        border-radius: 999px;
        background: currentColor;
      }
      .swatch.active, .size.active {
        background: rgba(255, 204, 0, 0.14);
        color: var(--accent);
      }
      body[data-layout="vertical"] #bar {
        flex-direction: column;
        justify-content: flex-start;
        padding: 10px 8px;
      }
      body[data-layout="vertical"] .grip {
        width: 34px;
        height: 12px;
      }
      body[data-layout="vertical"] #tools,
      body[data-layout="vertical"] .group {
        flex-direction: column;
      }
      body[data-layout="vertical"] .divider {
        width: 42px;
        height: 1px;
      }
      body[data-layout="vertical"] .popover {
        left: 50px;
        top: 310px;
        flex-direction: column;
      }
      body[data-layout="vertical"] #sizePanel { top: 354px; }
    </style>
  </head>
  <body data-layout="horizontal">
    <div id="bar">
      <span class="grip" title="이동"></span>

      <button class="icon primary" id="canvasToggle" title="화면 캔버스 켜기/끄기" aria-label="화면 캔버스 켜기/끄기">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 18v3"/></svg>
      </button>

      <span class="divider"></span>

      <div id="tools">
        <button class="tool requires-canvas" data-mode="spotlight" title="스포트라이트 (S)" aria-label="스포트라이트">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="tool requires-canvas" data-mode="draw" title="펜 (P)" aria-label="펜">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="tool requires-canvas" data-mode="line" title="선 (L)" aria-label="선">
          <svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>
        </button>
        <button class="tool requires-canvas" data-mode="rect" title="사각형 (R)" aria-label="사각형">
          <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
        </button>
        <button class="tool requires-canvas" data-mode="ellipse" title="원 (O)" aria-label="원">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>
        </button>
      </div>

      <span class="divider"></span>

      <div class="group">
        <button class="icon requires-canvas" id="colorButton" title="색상" aria-label="색상"><span class="swatch-dot"></span></button>
        <button class="icon requires-canvas" id="sizeButton" title="굵기" aria-label="굵기"><span class="stroke-dot"></span></button>
      </div>

      <span class="divider"></span>

      <div class="group">
        <button class="icon requires-canvas" id="undo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-1"/></svg>
        </button>
        <button class="icon requires-canvas" id="clear" title="모두 지우기 (X)" aria-label="모두 지우기">
          <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/></svg>
        </button>
        <button class="icon requires-canvas" id="hideOverlay" title="화면 캔버스 끄기 (H)" aria-label="화면 캔버스 끄기">
          <svg viewBox="0 0 24 24"><path d="M17.9 17.9A10.7 10.7 0 0 1 12 20C5 20 2 12 2 12a18 18 0 0 1 5.1-5.9"/><path d="M9.9 4.2A10.3 10.3 0 0 1 12 4c7 0 10 8 10 8a17.8 17.8 0 0 1-2.1 3.4"/><path d="M3 3l18 18"/></svg>
        </button>
        <button class="icon" id="close" title="닫기" aria-label="닫기">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="popover" id="colorPanel">
      <button class="swatch requires-canvas" data-color="#ffcc00" title="노랑" aria-label="노랑" style="--c:#ffcc00"><span></span></button>
      <button class="swatch requires-canvas" data-color="#ff4d4f" title="빨강" aria-label="빨강" style="--c:#ff4d4f"><span></span></button>
      <button class="swatch requires-canvas" data-color="#40c057" title="초록" aria-label="초록" style="--c:#40c057"><span></span></button>
      <button class="swatch requires-canvas" data-color="#339af0" title="파랑" aria-label="파랑" style="--c:#339af0"><span></span></button>
      <button class="swatch requires-canvas" data-color="#f8f9fa" title="흰색" aria-label="흰색" style="--c:#f8f9fa"><span></span></button>
    </div>

    <div class="popover" id="sizePanel">
      <button class="size requires-canvas" data-size="3" title="얇게" aria-label="얇게"><span style="height:3px"></span></button>
      <button class="size requires-canvas" data-size="4" title="보통" aria-label="보통"><span style="height:5px"></span></button>
      <button class="size requires-canvas" data-size="7" title="굵게" aria-label="굵게"><span style="height:8px"></span></button>
    </div>

    <script>
      const dap = window.dapPalette || {
        postMessage() {},
        onMessage() { return () => {}; },
        close() {},
      };
      const colorPanel = document.getElementById("colorPanel");
      const sizePanel = document.getElementById("sizePanel");
      const canvasToggle = document.getElementById("canvasToggle");
      const colorButton = document.getElementById("colorButton");
      const sizeButton = document.getElementById("sizeButton");
      let state = {
        mode: "draw",
        options: { color: "#ffcc00", strokeWidth: 4, layout: "horizontal" },
        overlayVisible: false,
      };

      function post(msg) { dap.postMessage(msg); }

      function closePanels(except) {
        if (except !== colorPanel) colorPanel.classList.remove("open");
        if (except !== sizePanel) sizePanel.classList.remove("open");
        colorButton.classList.toggle("open", colorPanel.classList.contains("open"));
        sizeButton.classList.toggle("open", sizePanel.classList.contains("open"));
      }

      function setActive() {
        document.body.dataset.layout = state.options.layout === "vertical" ? "vertical" : "horizontal";
        canvasToggle.classList.toggle("active", state.overlayVisible);
        document.querySelectorAll(".requires-canvas").forEach((el) => {
          el.disabled = !state.overlayVisible;
        });
        if (!state.overlayVisible) closePanels();
        document.querySelectorAll("[data-mode]").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.mode === state.mode && state.overlayVisible);
        });
        document.querySelectorAll("[data-color]").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.color === state.options.color);
        });
        document.querySelectorAll("[data-size]").forEach((btn) => {
          btn.classList.toggle("active", Number(btn.dataset.size) === Number(state.options.strokeWidth));
        });
        document.querySelector(".swatch-dot").style.background = state.options.color;
        document.querySelector(".stroke-dot").style.height = Math.min(9, Number(state.options.strokeWidth) + 1) + "px";
      }

      function patchOptions(options) {
        state.options = { ...state.options, ...options };
        setActive();
        post({ type: "options", options });
      }

      document.getElementById("close").addEventListener("click", () => dap.close());
      canvasToggle.addEventListener("click", () => {
        closePanels();
        if (state.overlayVisible) {
          state.overlayVisible = false;
          setActive();
          post({ type: "hideOverlay" });
          return;
        }
        state.overlayVisible = true;
        if (!state.mode) state.mode = "draw";
        setActive();
        post({ type: "mode", mode: state.mode });
      });
      document.getElementById("hideOverlay").addEventListener("click", () => post({ type: "hideOverlay" }));
      document.getElementById("undo").addEventListener("click", () => post({ type: "undo" }));
      document.getElementById("clear").addEventListener("click", () => post({ type: "clear" }));
      colorButton.addEventListener("click", () => {
        colorPanel.classList.toggle("open");
        closePanels(colorPanel);
      });
      sizeButton.addEventListener("click", () => {
        sizePanel.classList.toggle("open");
        closePanels(sizePanel);
      });

      document.querySelectorAll("[data-mode]").forEach((btn) => {
        btn.addEventListener("click", () => {
          closePanels();
          if (state.overlayVisible && state.mode === btn.dataset.mode) {
            state.overlayVisible = false;
            setActive();
            post({ type: "hideOverlay" });
            return;
          }
          state.mode = btn.dataset.mode;
          state.overlayVisible = true;
          setActive();
          post({ type: "mode", mode: state.mode });
        });
      });
      document.querySelectorAll("[data-color]").forEach((btn) => {
        btn.addEventListener("click", () => {
          closePanels();
          patchOptions({ color: btn.dataset.color });
        });
      });
      document.querySelectorAll("[data-size]").forEach((btn) => {
        btn.addEventListener("click", () => {
          closePanels();
          patchOptions({ strokeWidth: Number(btn.dataset.size) });
        });
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closePanels();
      });

      dap.onMessage((msg) => {
        if (!msg || msg.type !== "state") return;
        state = {
          ...state,
          mode: msg.mode || state.mode,
          overlayVisible: msg.overlayVisible === true,
          options: { ...state.options, ...(msg.options || {}) },
        };
        setActive();
      });
      setActive();
      post({ type: "ready" });
    </script>
  </body>
</html>

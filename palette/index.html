<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lecture Tools</title>
    <style>
      :root {
        --bg: #202124;
        --pill: #2b2f36;
        --pill-2: #363c45;
        --line: #48505b;
        --text: #f5f7fa;
        --muted: #a9b2bf;
        --accent: #ffcc00;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        place-items: center;
        background: transparent;
        color: var(--text);
        font: 13px/1.35 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        user-select: none;
      }
      button {
        -webkit-app-region: no-drag;
        border: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #bar {
        -webkit-app-region: drag;
        width: calc(100vw - 12px);
        height: 62px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--pill);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.34);
      }
      .grip {
        width: 12px;
        height: 32px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: radial-gradient(circle, var(--muted) 1.45px, transparent 1.65px) 0 0 / 7px 7px;
        opacity: 0.8;
      }
      #modes {
        display: flex;
        gap: 4px;
        padding: 3px;
        border-radius: 999px;
        background: #22262c;
        box-shadow: inset 0 0 0 1px #3a414b;
      }
      .mode {
        height: 40px;
        min-width: 68px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 10px;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-weight: 700;
      }
      .mode:hover { background: var(--pill-2); color: var(--text); }
      .mode.active {
        background: rgba(255, 204, 0, 0.18);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px rgba(255, 204, 0, 0.55);
      }
      svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }
      .divider {
        width: 1px;
        height: 30px;
        background: var(--line);
      }
      .group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .swatch {
        width: 23px;
        height: 23px;
        border-radius: 999px;
        background: var(--c);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.68);
      }
      .swatch.active {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .size, .icon {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
      }
      .size:hover, .icon:hover { background: var(--pill-2); color: var(--text); }
      .size.active {
        color: var(--accent);
        background: rgba(255, 204, 0, 0.13);
      }
      .size span {
        width: 18px;
        border-radius: 999px;
        background: currentColor;
      }
      #clear { color: var(--danger); }
    </style>
  </head>
  <body>
    <div id="bar">
      <span class="grip" title="이동"></span>

      <div id="modes">
        <button class="mode" data-mode="cursor" title="커서 강조">
          <svg viewBox="0 0 24 24"><path d="M4 4l7 16 2-7 7-2L4 4z"/></svg>
          <span>커서</span>
        </button>
        <button class="mode" data-mode="draw" title="화면 판서">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          <span>펜</span>
        </button>
        <button class="mode" data-mode="spotlight" title="스포트라이트">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <span>조명</span>
        </button>
      </div>

      <span class="divider"></span>

      <div class="group">
        <button class="swatch" data-color="#ffcc00" title="노랑" aria-label="노랑" style="--c:#ffcc00"></button>
        <button class="swatch" data-color="#ff4d4f" title="빨강" aria-label="빨강" style="--c:#ff4d4f"></button>
        <button class="swatch" data-color="#40c057" title="초록" aria-label="초록" style="--c:#40c057"></button>
        <button class="swatch" data-color="#339af0" title="파랑" aria-label="파랑" style="--c:#339af0"></button>
      </div>

      <span class="divider"></span>

      <div class="group">
        <button class="size" data-size="3" title="얇게" aria-label="얇게"><span style="height:3px"></span></button>
        <button class="size" data-size="4" title="보통" aria-label="보통"><span style="height:5px"></span></button>
        <button class="size" data-size="7" title="굵게" aria-label="굵게"><span style="height:8px"></span></button>
      </div>

      <span class="divider"></span>

      <button class="icon" id="undo" title="되돌리기" aria-label="되돌리기">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-1"/></svg>
      </button>
      <button class="icon" id="clear" title="모두 지우기" aria-label="모두 지우기">
        <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/></svg>
      </button>
      <button class="icon" id="hideOverlay" title="오버레이 숨기기" aria-label="오버레이 숨기기">
        <svg viewBox="0 0 24 24"><path d="M17.9 17.9A10.7 10.7 0 0 1 12 20C5 20 2 12 2 12a18 18 0 0 1 5.1-5.9"/><path d="M9.9 4.2A10.3 10.3 0 0 1 12 4c7 0 10 8 10 8a17.8 17.8 0 0 1-2.1 3.4"/><path d="M3 3l18 18"/></svg>
      </button>
      <button class="icon" id="close" title="닫기" aria-label="닫기">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>

    <script>
      const dap = window.dapPalette || {
        postMessage() {},
        onMessage() { return () => {}; },
        close() {},
      };
      let state = { mode: "cursor", options: { color: "#ffcc00", strokeWidth: 4 }, overlayVisible: false };

      function post(msg) { dap.postMessage(msg); }
      function setActive() {
        document.querySelectorAll("[data-mode]").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.mode === state.mode);
        });
        document.querySelectorAll("[data-color]").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.color === state.options.color);
        });
        document.querySelectorAll("[data-size]").forEach((btn) => {
          btn.classList.toggle("active", Number(btn.dataset.size) === Number(state.options.strokeWidth));
        });
      }
      function patchOptions(options) {
        state.options = { ...state.options, ...options };
        setActive();
        post({ type: "options", options });
      }

      document.getElementById("close").addEventListener("click", () => dap.close());
      document.getElementById("hideOverlay").addEventListener("click", () => post({ type: "hideOverlay" }));
      document.getElementById("undo").addEventListener("click", () => post({ type: "undo" }));
      document.getElementById("clear").addEventListener("click", () => post({ type: "clear" }));

      document.querySelectorAll("[data-mode]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.mode = btn.dataset.mode;
          state.overlayVisible = true;
          setActive();
          post({ type: "mode", mode: state.mode });
        });
      });
      document.querySelectorAll("[data-color]").forEach((btn) => {
        btn.addEventListener("click", () => patchOptions({ color: btn.dataset.color }));
      });
      document.querySelectorAll("[data-size]").forEach((btn) => {
        btn.addEventListener("click", () => patchOptions({ strokeWidth: Number(btn.dataset.size) }));
      });

      dap.onMessage((msg) => {
        if (!msg || msg.type !== "state") return;
        state = {
          ...state,
          mode: msg.mode || state.mode,
          overlayVisible: msg.overlayVisible === true,
          options: { ...state.options, ...(msg.options || {}) },
        };
        setActive();
      });
      setActive();
      post({ type: "ready" });
    </script>
  </body>
</html>

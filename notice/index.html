<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lecture Notice</title>
    <style>
      :root {
        --bg: #1e1f22;
        --panel: #2b2d31;
        --panel-hover: #34363c;
        --text: #e6e7ea;
        --muted: #9aa0a8;
        --border: #3a3d44;
        --accent: #ffcc00;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        color: var(--text);
        font: 14px/1.45 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      #titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
        cursor: grab;
      }
      #titlebar:active { cursor: grabbing; }
      #titlebar .grip {
        display: inline-flex;
        color: var(--muted);
      }
      #titlebar:hover .grip { color: var(--text); }
      #titlebar .title {
        font-weight: 700;
      }
      #titlebar .spacer {
        flex: 1;
      }
      .icon-btn {
        -webkit-app-region: no-drag;
        background: transparent;
        border: 0;
        color: var(--muted);
        cursor: pointer;
        font: 700 12px/1 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        padding: 6px 8px;
        border-radius: 6px;
      }
      .icon-btn:hover {
        color: var(--text);
        background: var(--panel);
      }
      #content {
        flex: 1;
        min-height: 0;
        padding: 8px;
      }
      #editor {
        -webkit-app-region: no-drag;
        width: 100%;
        height: 100%;
        resize: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: 0;
        background: var(--panel);
        color: var(--text);
        padding: 28px 32px;
        text-align: center;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 800 var(--notice-editor-size, 42px)/1.22 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        letter-spacing: 0;
        user-select: text;
      }
      #editor:focus { border-color: var(--accent); }
      #editor::placeholder { color: var(--muted); }
      #display {
        -webkit-app-region: no-drag;
        display: none;
        width: 100%;
        height: 100%;
        align-content: center;
        overflow: hidden;
        border-radius: 6px;
        background: #111216;
        padding: 34px;
        text-align: center;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #ffffff;
        font: 900 var(--notice-display-size, 58px)/1.18 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        letter-spacing: 0;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.46);
      }
      body.displaying #editor {
        display: none;
      }
      body.displaying #display {
        display: grid;
      }
    </style>
  </head>
  <body>
    <div id="titlebar" title="여기를 잡고 드래그하면 창을 옮길 수 있어요">
      <span class="grip" aria-hidden="true"><svg viewBox="0 0 16 16" width="10" height="16" fill="currentColor"><circle cx="5" cy="4" r="1.3"/><circle cx="5" cy="8" r="1.3"/><circle cx="5" cy="12" r="1.3"/><circle cx="11" cy="4" r="1.3"/><circle cx="11" cy="8" r="1.3"/><circle cx="11" cy="12" r="1.3"/></svg></span>
      <span class="title">안내사항</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="toggleNotice" type="button" title="표시/편집">표시</button>
      <button class="icon-btn" id="closeButton" type="button" title="닫기">✕</button>
    </div>
    <div id="content">
      <textarea id="editor" maxlength="220" placeholder="안내사항을 입력하세요"></textarea>
      <div id="display"></div>
    </div>
    <script>
      const bridge = window.dapPalette || {
        postMessage() {},
        onMessage() { return () => {}; },
        close() {},
      };
      const editor = document.getElementById("editor");
      const display = document.getElementById("display");
      const toggleButton = document.getElementById("toggleNotice");
      const closeButton = document.getElementById("closeButton");

      let noticeText = "";
      let visible = false;
      let textSize = 58;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function applyTextSize() {
        const displaySize = clamp(Math.round(textSize), 32, 96);
        const editorSize = clamp(Math.round(displaySize * 0.72), 24, 68);
        document.documentElement.style.setProperty("--notice-display-size", `${displaySize}px`);
        document.documentElement.style.setProperty("--notice-editor-size", `${editorSize}px`);
      }

      function markPasteTarget() {
        bridge.postMessage({ type: "noticePasteTarget" });
      }

      function syncDraftFromEditor() {
        if (!visible) noticeText = editor.value;
      }

      function postDraft() {
        bridge.postMessage({ type: "noticeDraft", text: noticeText });
      }

      function render(focusEditor) {
        applyTextSize();
        document.body.classList.toggle("displaying", visible);
        toggleButton.textContent = visible ? "편집" : "표시";
        if (!visible && editor.value !== noticeText) editor.value = noticeText;
        display.textContent = noticeText;
        if (focusEditor && !visible) {
          requestAnimationFrame(() => {
            editor.focus();
            editor.select();
            markPasteTarget();
          });
        }
      }

      function showNotice() {
        const value = editor.value.trim();
        if (!value) {
          hideNotice();
          return;
        }
        noticeText = value;
        visible = true;
        render(false);
        bridge.postMessage({ type: "notice", text: noticeText });
      }

      function hideNotice() {
        syncDraftFromEditor();
        visible = false;
        render(true);
        bridge.postMessage({ type: "hideNotice", text: noticeText });
      }

      editor.addEventListener("input", () => {
        noticeText = editor.value;
        postDraft();
        markPasteTarget();
      });
      editor.addEventListener("paste", () => {
        requestAnimationFrame(() => {
          noticeText = editor.value;
          postDraft();
          markPasteTarget();
        });
      });
      editor.addEventListener("focus", markPasteTarget);
      editor.addEventListener("pointerdown", markPasteTarget);
      editor.addEventListener("click", markPasteTarget);

      toggleButton.addEventListener("click", () => {
        if (visible) hideNotice();
        else showNotice();
      });

      closeButton.addEventListener("click", () => {
        bridge.postMessage({ type: "closeNotice" });
        if (typeof bridge.close === "function") bridge.close();
      });

      window.addEventListener("focus", markPasteTarget);

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if ((event.ctrlKey || event.metaKey) && key === "enter") {
          event.preventDefault();
          showNotice();
        } else if ((event.ctrlKey || event.metaKey) && key === "w") {
          event.preventDefault();
          bridge.postMessage({ type: "closeNotice" });
          if (typeof bridge.close === "function") bridge.close();
        } else if (key === "escape") {
          event.preventDefault();
          hideNotice();
        }
      });

      window.addEventListener("wheel", (event) => {
        event.preventDefault();
        syncDraftFromEditor();
        const direction = event.deltaY < 0 ? 1 : -1;
        const fine = Math.abs(event.deltaY) < 24;
        const step = fine ? 2 : 4;
        textSize = clamp(textSize + direction * step, 32, 96);
        render(false);
        bridge.postMessage({ type: "noticeTextSize", textSize });
      }, { passive: false });

      bridge.onMessage((msg) => {
        if (!msg || typeof msg !== "object") return;
        if (msg.type === "state") {
          noticeText = typeof msg.text === "string" ? msg.text : noticeText;
          if (Number.isFinite(Number(msg.textSize))) textSize = Number(msg.textSize);
          visible = msg.visible === true && noticeText.trim().length > 0;
          render(!visible);
        } else if (msg.type === "editNotice") {
          noticeText = typeof msg.text === "string" ? msg.text : noticeText;
          if (Number.isFinite(Number(msg.textSize))) textSize = Number(msg.textSize);
          visible = false;
          render(true);
        } else if (msg.type === "notice") {
          noticeText = typeof msg.text === "string" ? msg.text.trim() : "";
          if (Number.isFinite(Number(msg.textSize))) textSize = Number(msg.textSize);
          visible = noticeText.length > 0;
          render(false);
        } else if (msg.type === "hideNotice") {
          visible = false;
          render(true);
        } else if (msg.type === "pasteTargetFocus") {
          if (!visible && document.activeElement !== editor) {
            requestAnimationFrame(() => {
              editor.focus();
            });
          }
        }
      });

      render(true);
      bridge.postMessage({ type: "ready" });
    </script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lecture Notice</title>
    <style>
      :root {
        --panel: #ffffff;
        --text: #17191f;
        --border: #d9dde5;
        --accent: #ffcc00;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        padding: 6px;
        color: var(--text);
        font: 14px/1.45 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      }
      #chrome {
        -webkit-app-region: no-drag;
        position: absolute;
        top: 14px;
        right: 16px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0.84;
        transition: opacity 120ms ease;
      }
      #chrome:hover,
      #chrome:focus-within {
        opacity: 1;
      }
      #handle {
        -webkit-app-region: drag;
        width: 40px;
        height: 28px;
        border: 1px solid rgba(23, 25, 31, 0.1);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 8px 22px rgba(31, 35, 44, 0.13);
        cursor: grab;
        display: grid;
        grid-template-columns: repeat(3, 4px);
        justify-content: center;
        align-content: center;
        gap: 4px;
      }
      #handle:active {
        cursor: grabbing;
      }
      #handle span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(23, 25, 31, 0.52);
      }
      #closeButton {
        -webkit-app-region: no-drag;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        color: #d94848;
        box-shadow: 0 8px 22px rgba(31, 35, 44, 0.13);
        cursor: pointer;
        font: 900 24px/30px -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        text-align: center;
        padding: 0;
      }
      #closeButton:hover {
        background: #fff1f1;
      }
      #editor {
        -webkit-app-region: no-drag;
        width: 100%;
        height: 100%;
        resize: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: 3px solid rgba(255, 204, 0, 0.24);
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 18px 52px rgba(31, 35, 44, 0.16);
        padding: 28px 32px;
        text-align: center;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 800 var(--notice-editor-size, 42px)/1.22 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        letter-spacing: 0;
      }
      #display {
        -webkit-app-region: no-drag;
        display: none;
        width: 100%;
        height: 100%;
        align-content: center;
        overflow: hidden;
        border-radius: 8px;
        background: rgba(18, 20, 26, 0.94);
        padding: 34px;
        text-align: center;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: #ffffff;
        font: 900 var(--notice-display-size, 58px)/1.18 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
        letter-spacing: 0;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.46);
      }
      body.displaying #editor {
        display: none;
      }
      body.displaying #display {
        display: grid;
      }
    </style>
  </head>
  <body>
    <div id="chrome" aria-label="안내창 조작">
      <div id="handle" title="이동" aria-label="이동 핸들" role="button">
        <span></span><span></span><span></span>
      </div>
      <button id="closeButton" type="button" aria-label="닫기">×</button>
    </div>
    <textarea id="editor" maxlength="220" placeholder="안내사항을 입력하세요"></textarea>
    <div id="display"></div>
    <script>
      const bridge = window.dapPalette || {
        postMessage() {},
        onMessage() { return () => {}; },
        close() {},
      };
      const editor = document.getElementById("editor");
      const display = document.getElementById("display");
      const closeButton = document.getElementById("closeButton");

      let noticeText = "";
      let visible = false;
      let textSize = 58;

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function applyTextSize() {
        const displaySize = clamp(Math.round(textSize), 32, 96);
        const editorSize = clamp(Math.round(displaySize * 0.72), 24, 68);
        document.documentElement.style.setProperty("--notice-display-size", `${displaySize}px`);
        document.documentElement.style.setProperty("--notice-editor-size", `${editorSize}px`);
      }

      function markPasteTarget() {
        bridge.postMessage({ type: "noticePasteTarget" });
      }

      function syncDraftFromEditor() {
        if (!visible) noticeText = editor.value;
      }

      function render(focusEditor) {
        applyTextSize();
        document.body.classList.toggle("displaying", visible);
        if (!visible && editor.value !== noticeText) editor.value = noticeText;
        display.textContent = noticeText;
        if (focusEditor && !visible) {
          requestAnimationFrame(() => {
            editor.focus();
            editor.select();
            markPasteTarget();
          });
        }
      }

      function showNotice() {
        const value = editor.value.trim();
        if (!value) {
          hideNotice();
          return;
        }
        noticeText = value;
        visible = true;
        render(false);
        bridge.postMessage({ type: "notice", text: noticeText });
      }

      function hideNotice() {
        syncDraftFromEditor();
        visible = false;
        render(true);
        bridge.postMessage({ type: "hideNotice" });
      }

      editor.addEventListener("input", () => {
        noticeText = editor.value;
        markPasteTarget();
      });
      editor.addEventListener("paste", () => {
        requestAnimationFrame(() => {
          noticeText = editor.value;
          markPasteTarget();
        });
      });
      editor.addEventListener("focus", markPasteTarget);
      editor.addEventListener("pointerdown", markPasteTarget);
      editor.addEventListener("click", markPasteTarget);

      closeButton.addEventListener("click", () => {
        bridge.postMessage({ type: "closeNotice" });
        if (typeof bridge.close === "function") bridge.close();
      });

      window.addEventListener("focus", markPasteTarget);

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if ((event.ctrlKey || event.metaKey) && key === "enter") {
          event.preventDefault();
          showNotice();
        } else if ((event.ctrlKey || event.metaKey) && key === "w") {
          event.preventDefault();
          bridge.postMessage({ type: "closeNotice" });
          if (typeof bridge.close === "function") bridge.close();
        } else if (key === "escape") {
          event.preventDefault();
          hideNotice();
        }
      });

      window.addEventListener("wheel", (event) => {
        event.preventDefault();
        syncDraftFromEditor();
        const direction = event.deltaY < 0 ? 1 : -1;
        const fine = Math.abs(event.deltaY) < 24;
        const step = fine ? 2 : 4;
        textSize = clamp(textSize + direction * step, 32, 96);
        render(false);
        bridge.postMessage({ type: "noticeTextSize", textSize });
      }, { passive: false });

      bridge.onMessage((msg) => {
        if (!msg || typeof msg !== "object") return;
        if (msg.type === "state") {
          noticeText = typeof msg.text === "string" ? msg.text : noticeText;
          if (Number.isFinite(Number(msg.textSize))) textSize = Number(msg.textSize);
          visible = msg.visible === true && noticeText.trim().length > 0;
          render(!visible);
        } else if (msg.type === "editNotice") {
          noticeText = typeof msg.text === "string" ? msg.text : noticeText;
          if (Number.isFinite(Number(msg.textSize))) textSize = Number(msg.textSize);
          visible = false;
          render(true);
        } else if (msg.type === "notice") {
          noticeText = typeof msg.text === "string" ? msg.text.trim() : "";
          if (Number.isFinite(Number(msg.textSize))) textSize = Number(msg.textSize);
          visible = noticeText.length > 0;
          render(false);
        } else if (msg.type === "hideNotice") {
          visible = false;
          render(true);
        } else if (msg.type === "pasteTargetFocus") {
          if (!visible && document.activeElement !== editor) {
            requestAnimationFrame(() => {
              editor.focus();
            });
          }
        }
      });

      render(true);
      bridge.postMessage({ type: "ready" });
    </script>
  </body>
</html>
